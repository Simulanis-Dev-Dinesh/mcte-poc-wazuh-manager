# Three-node Wazuh stack, all three images fixed for OpenStack (cloud-init enabled).
name: mcte-poc-wazuh-3node
hosts:
  - name: wazuh-manager
    base_box:
      image: wazuh-manager-ci
      mgmt_user: crczp
    flavor: wazuh.manager
  - name: wazuh-indexer
    base_box:
      image: wazuh-indexer-ci
      mgmt_user: crczp
    flavor: wazuh.indexer
  - name: wazuh-dashboard
    base_box:
      image: wazuh-dashboard-ci
      mgmt_user: crczp
    flavor: wazuh.dashboard
routers:
  - name: edge
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small
wan:
  name: wan
  cidr: 100.64.0.0/24
networks:
  - name: lan
    cidr: 10.10.20.0/24
net_mappings:
  - host: wazuh-manager
    network: lan
    ip: 10.10.20.10
  - host: wazuh-indexer
    network: lan
    ip: 10.10.20.11
  - host: wazuh-dashboard
    network: lan
    ip: 10.10.20.12
router_mappings:
  - router: edge
    network: lan
    ip: 10.10.20.1
groups:
  - name: wazuh_manager
    nodes: [wazuh-manager]
  - name: wazuh_indexer
    nodes: [wazuh-indexer]
  - name: wazuh_dashboard
    nodes: [wazuh-dashboard]
